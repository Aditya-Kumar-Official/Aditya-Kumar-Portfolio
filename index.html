    <!-- Apply the saved theme before first paint so there is no light/dark flash. -->
    <script>
      try {
        var t = localStorage.getItem('ak-theme');
        if (t !== 'dark' && t !== 'light') t = 'dark'; // dark is the default; the visitor's explicit choice is remembered
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name=theme-color]').content = t === 'light' ? '#f6f7fd' : '#07080f';
      } catch (e) {}
    </script>
